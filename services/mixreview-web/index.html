<!doctype html>
<html lang="en" class="app-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <title>MixReview</title>
    <style>
      /*
       * Inline baseline — loaded synchronously, before any external CSS.
       * Keeps the page dark on iOS deep-sleep wake when the external
       * stylesheet is slow (cache evicted, radio waking up, CORS delay).
       */
      html, body {
        margin: 0;
        background: #0a0a0a;
        color: #f5f1e8;
        min-height: 100vh;
      }
      /*
       * Loading guard — hides #root until React commits its first render
       * and main.jsx removes the app-loading class.  Uses visibility:hidden
       * (not display:none) so layout measurement inside React still works.
       * Prevents the brief flash of unstyled React HTML during the gap
       * between JS execution and CSS arrival.
       */
      html.app-loading #root {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
